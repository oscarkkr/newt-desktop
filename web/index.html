<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>新T树洞</title>
  <link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./preferences.css"><script type="module" src="./app.js"></script>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="mark">T</div><div><b>新T树洞</b><small>轻量桌面端</small></div></div>
    <nav>
      <button class="nav active" data-route="timeline"><i>⌂</i>时间线</button>
      <button class="nav" data-route="search"><i>⌕</i>全文搜索</button>
      <button class="nav" data-route="attention"><i>☆</i>线上关注</button>
      <button class="nav" data-route="favorites"><i>◆</i>本地收藏</button>
      <button class="nav" data-route="offline"><i>◫</i>离线查看</button>
    </nav>
    <div class="bottom">
      <div class="status"><span id="dot"></span><div><b id="status">正在连接</b><small id="status-detail">检查服务器…</small></div></div>
      <button id="settings" class="nav"><i>⚙</i>设置</button>
    </div>
  </aside>
  <main>
    <section class="feed">
      <header><div><small class="eyebrow" id="eyebrow">NEW T FEED</small><h1 id="title">正在发生</h1></div><button id="compose" class="primary">＋ 发布</button></header>
      <form id="search-form" class="search hidden"><span>⌕</span><input id="search-input" placeholder="全文搜索，支持 +必含、-排除、精确短语…"><kbd>↵</kbd></form>
      <div class="tools"><div id="orders" class="seg"><button data-order="0" class="active">最新</button><button data-order="1">热门</button></div><label>分区 <input id="room" placeholder="全部"></label><button id="refresh" class="icon">↻</button></div>
      <div id="notice" class="notice hidden"></div><div id="posts" class="posts"></div>
      <div id="empty" class="empty hidden"><b>这里还没有内容</b><span>换个关键词或分区再试试。</span></div>
      <button id="more" class="more hidden">加载更多</button>
    </section>
    <div id="resize-handle" class="resize-handle" role="separator" aria-label="调整帖子列表宽度" aria-orientation="vertical" aria-valuemin="340" aria-valuenow="470" tabindex="0"></div>
    <section id="detail-panel" class="detail">
      <div id="placeholder" class="placeholder"><div class="rings"><i></i><i></i><i></i></div><h2>选一条，听见洞里的回声</h2><p>点击左侧帖子查看全文和评论。<br>所有时间均以北京时间显示。</p></div>
      <article id="detail" class="card hidden">
        <div class="detail-head"><button id="back">← 返回</button><b id="pid">#—</b><div class="detail-actions"><button id="favorite">◆ 收藏</button><button id="attention">☆ 关注</button></div></div>
        <div id="post-body"></div>
        <section class="comments"><h2>洞内回声 <small id="comment-count">0</small></h2>
          <form id="comment-form">
            <div id="reply-context" class="reply-context hidden"><span>正在回复 <b id="reply-target"></b></span><button id="reply-cancel" type="button">取消</button></div>
            <textarea id="comment-input" placeholder="友善地留下你的回应…"></textarea>
            <div class="comment-actions"><label><input id="comment-title" type="checkbox"> 使用头衔</label><button class="primary">发送评论</button></div>
          </form>
          <div id="comments"></div>
        </section>
      </article>
    </section>
  </main>
</div>
<dialog id="settings-dialog" aria-labelledby="settings-title"><form id="settings-form" method="dialog">
  <header><div><small class="eyebrow">CONNECTION</small><h2 id="settings-title" tabindex="-1">连接设置</h2></div><button value="cancel" aria-label="关闭设置">×</button></header>
  <div class="safe"><b>登录凭证只保存在 macOS 钥匙串</b><span>不会写入配置文件、日志或同步到云端。</span></div>
  <label class="field">服务器地址<input id="base-url" type="url" required placeholder="https://api.tholeapis.top"><small>可填写根地址或 /_api/v1 地址</small></label>
  <section class="github-login-card" aria-labelledby="github-login-title">
    <div><b id="github-login-title">推荐登录方式</b><small>在 App 内完成 GitHub 授权，成功后自动保存登录状态。</small></div>
    <button type="button" id="github-login" class="github-login-button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .8a11.4 11.4 0 0 0-3.6 22.2c.6.1.8-.2.8-.5v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.1 1.2a10.8 10.8 0 0 1 5.7 0c2.2-1.5 3.1-1.2 3.1-1.2.6 1.5.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.1v3.1c0 .3.2.6.8.5A11.4 11.4 0 0 0 12 .8Z"/></svg>
      使用 GitHub 登录
    </button>
    <p>需先在 GitHub 账户中添加清华邮箱或校友邮箱。</p>
  </section>
  <div class="manual-token-divider"><span>高级选项</span></div>
  <label class="field">手动输入 Token<input id="token" type="password" placeholder="留空则保持现有 Token"><small>仅在 GitHub 登录不可用时使用</small></label>
  <label class="field">字体大小
    <span class="font-size-control"><b class="font-preview small">A</b><input id="font-scale" type="range" min="90" max="130" step="5" value="100"><b class="font-preview large">A</b><output id="font-scale-value">100%</output></span>
    <small>调整后立即预览，并自动保存在本机</small>
  </label>
  <footer><button type="button" id="clear" class="danger">清除缓存</button><span></span><button value="cancel">取消</button><button class="primary">保存并测试</button></footer>
</form></dialog>
<dialog id="compose-dialog"><form id="compose-form" method="dialog">
  <header><div><small class="eyebrow">NEW POST</small><h2>把话放进树洞</h2></div><button value="cancel">×</button></header>
  <label class="field">折叠标题（可选）<input id="cw" placeholder="给需要提醒的内容加一句说明"></label>
  <label class="field">正文<textarea id="text" rows="8" required placeholder="此刻你想说什么？"></textarea></label>
  <div class="row"><label class="field">分区 ID<input id="post-room" placeholder="可选"></label><label><input id="allow-search" type="checkbox" checked> 允许搜索</label><label><input id="use-title" type="checkbox"> 使用头衔</label></div>
  <footer><span></span><button value="cancel">取消</button><button class="primary">确认发布</button></footer>
</form></dialog>
<dialog id="image-dialog" class="image-dialog">
  <button id="image-close" class="image-close" type="button" aria-label="关闭图片">×</button>
  <img id="image-preview" alt="">
  <p id="image-caption"></p>
</dialog>
<div id="toasts"></div>
</body></html>
